<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Flashlight Game</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <main>
      <h1 id="game-title">Flashlight Game</h1>
      <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
          <div id="unity-logo"></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>
        <div id="unity-warning"> </div>
        <div id="unity-footer">
          <div id="unity-logo-title-footer"></div>
          <div id="unity-fullscreen-button"></div>
          <div id="unity-build-title">Flashlight Game</div>
        </div>
      </div>

      <div class="box--game-page">
        <div class="block-title uppercase">
          Game controls
        </div>

        <div class="keys-for-game">
          <ul>
            <li>
              <div class="key-definition">
                <div class="keyboard-key">WASD</div>
                <div class="action-text-container">
                  Move flashlight
                </div>
              </div>
              <div class="key-definition">
                <div class="keyboard-key">← →</div>
                <div class="action-text-container">
                  Look around
                </div>
              </div>
            </li>
            <li>
              <div class="key-definition">
                <div class="keyboard-key">ESC</div>
                <div class="action-text-container">
                  Exit gameplay
                </div>
              </div>
              <div class="key-definition">
                <div class="keyboard-key">Q</div>
                <div class="action-text-container">
                  Pause
                </div>
              </div>
              <div class="key-definition">
                <div class="keyboard-key">E</div>
                <div class="action-text-container">
                  Shoot
                </div>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </main>

    <div id="start-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-direction: column;">
      <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px 60px; border-radius: 20px; font-size: 32px; font-family: Arial, sans-serif; font-weight: bold; color: white; box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center;">
        🎮 CLICK TO START
        <div style="font-size: 16px; margin-top: 10px; opacity: 0.8;">Tap anywhere to begin</div>
      </div>
    </div>

    <script>
      (function() {
          // ========== CONFIG ==========
          var buildUrl = "Build";
          var loaderUrl = buildUrl + "/WebBuild.loader.js";
          
          var canvas = document.querySelector("#unity-canvas");
          var loadingBar = document.querySelector("#unity-loading-bar");
          var progressBarFull = document.querySelector("#unity-progress-bar-full");
          var overlay = document.getElementById("start-overlay");
          
          // ========== FAKE FULL AUDIO CONTEXT ==========
          // Save original constructor
          const OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
          
          // Create fake AudioContext with full properties
          function createFakeAudioContext() {
            // Create listener object with full properties
            const listener = {
              positionX: { value: 0 },
              positionY: { value: 0 },
              positionZ: { value: 0 },
              forwardX: { value: 0 },
              forwardY: { value: 0 },
              forwardZ: { value: -1 },
              upX: { value: 0 },
              upY: { value: 1 },
              upZ: { value: 0 },
              setPosition: function(x, y, z) {},
              setOrientation: function(fx, fy, fz, ux, uy, uz) {}
            };
            
            return {
              state: 'suspended',
              currentTime: 0,
              sampleRate: 44100,
              destination: {},
              listener: listener,
              _isFake: true,
              
              // Methods
              resume: () => Promise.resolve(),
              suspend: () => Promise.resolve(),
              close: () => Promise.resolve(),
              
              // AudioNode factories
              createGain: () => ({
                connect: () => {},
                disconnect: () => {},
                gain: { value: 1 }
              }),
              
              createBufferSource: () => ({
                connect: () => {},
                disconnect: () => {},
                start: () => {},
                stop: () => {},
                buffer: null,
                loop: false,
                loopStart: 0,
                loopEnd: 0,
                playbackRate: { value: 1 }
              }),
              
              createMediaElementSource: () => ({ connect: () => {} }),
              createScriptProcessor: () => ({ connect: () => {} }),
              createAnalyser: () => ({
                connect: () => {},
                fftSize: 2048,
                frequencyBinCount: 1024,
                getByteFrequencyData: () => {},
                getByteTimeDomainData: () => {}
              }),
              
              createOscillator: () => ({
                connect: () => {},
                disconnect: () => {},
                start: () => {},
                stop: () => {},
                frequency: { value: 440 },
                type: 'sine'
              }),
              
              createBiquadFilter: () => ({ connect: () => {}, frequency: { value: 350 } }),
              createDynamicsCompressor: () => ({ connect: () => {} }),
              createPanner: () => ({
                connect: () => {},
                panningModel: 'equalpower',
                distanceModel: 'inverse',
                refDistance: 1,
                maxDistance: 10000,
                rolloffFactor: 1,
                coneInnerAngle: 360,
                coneOuterAngle: 0,
                coneOuterGain: 0
              }),
              
              createStereoPanner: () => ({ connect: () => {}, pan: { value: 0 } }),
              createConstantSource: () => ({ connect: () => {}, start: () => {}, offset: { value: 0 } }),
              createChannelMerger: () => ({ connect: () => {} }),
              createChannelSplitter: () => ({ connect: () => {} }),
              createConvolver: () => ({ connect: () => {}, buffer: null }),
              createDelay: () => ({ connect: () => {}, delayTime: { value: 0 } }),
              createIIRFilter: () => ({ connect: () => {} }),
              createPeriodicWave: () => ({}),
              createWaveShaper: () => ({ connect: () => {}, curve: null }),
              decodeAudioData: () => Promise.resolve(null)
            };
          }
          
          // Fake constructor
          function FakeAudioContext() {
            return createFakeAudioContext();
          }
          
          // Overwrite global constructor
          window.AudioContext = FakeAudioContext;
          window.webkitAudioContext = FakeAudioContext;
          
          // ========== INITIALIZE UNITY AFTER USER CLICK ==========
          let isGameStarted = false;
          let unityInstance = null;
          
          function startGame() {
            if (isGameStarted) return;
            isGameStarted = true;
            
            // Delete overlay
            if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
            
            // Restore real AudioContext
            window.AudioContext = OriginalAudioContext;
            window.webkitAudioContext = OriginalAudioContext;
            
            // Display loading bar
            if (loadingBar) loadingBar.style.display = "block";
            
            // Load and run Unity
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
              createUnityInstance(canvas, {
                dataUrl: buildUrl + "/WebBuild.data.unityweb",
                frameworkUrl: buildUrl + "/WebBuild.framework.js.unityweb",
                codeUrl: buildUrl + "/WebBuild.wasm.unityweb",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "RTU MIREA",
                productName: "Flashlight Game",
                productVersion: "0.1.0",
                matchWebGLToCanvasSize: true,
              }, (progress) => {
                if (progressBarFull) progressBarFull.style.width = 100 * progress + "%";
              }).then((instance) => {
                unityInstance = instance;
                if (loadingBar) loadingBar.style.display = "none";
                
                // Activate fullscreen button
                var fullscreenBtn = document.querySelector("#unity-fullscreen-button");
                if (fullscreenBtn) {
                  fullscreenBtn.onclick = () => instance.SetFullscreen(1);
                }
                
                // Resume real AudioContext if needed
                setTimeout(() => {
                  if (instance.Module && instance.Module.ctx) {
                    const ctx = instance.Module.ctx;
                    if (ctx.state === 'suspended') {
                      ctx.resume();
                    }
                  }
                }, 100);
                
              }).catch((message) => {
                console.error("Unity error:", message);
                alert("Failed to load game: " + message);
              });
            };
            document.body.appendChild(script);
          }
          
          // Listen to user interaction
          overlay.addEventListener('click', startGame);
          overlay.addEventListener('touchstart', startGame);
          document.addEventListener('keydown', startGame, { once: true });
          
          // Hide initial loading bar
          if (loadingBar) loadingBar.style.display = "none";
      })();
    </script>
  </body>
</html>
